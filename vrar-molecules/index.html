<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR молекулалар — Molekula</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--line:#e8e7e3;--ink:#20201e;--muted:#73716c;--cyan:#2378d4;--gold:#c86f2b;--mint:#3d9368}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}
body{min-height:100vh;background:var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
header{background:#fff}.mk-brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink);text-decoration:none;font-size:17px;white-space:nowrap}.mk-mark{width:32px;height:32px;border-radius:8px;background:#2378d4;color:#fff;display:grid;place-items:center;font-weight:800}.mk-back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}.mk-back:hover{background:#eaf3fb}.mk-back{margin-left:auto}
header h1{font-size:18px;margin:0 0 0 10px;color:var(--muted);font-weight:700}
main{display:grid;grid-template-columns:1fr 380px;gap:18px;padding:18px 22px;height:calc(100vh - 62px);min-height:560px}
.stage{position:relative;background:linear-gradient(#ffffff,#e9eef3);border:1px solid var(--line);border-radius:18px;overflow:hidden}
model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}
.tabs{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:2;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#ffffffe6;color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:800;font-size:16px;cursor:pointer}
.tab.on{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.arbtn{position:absolute;right:16px;bottom:16px;border:0;border-radius:999px;padding:14px 22px;background:var(--cyan);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.hint{position:absolute;left:16px;bottom:18px;color:var(--muted);font-size:13px}
aside{display:flex;flex-direction:column;gap:14px}
.card{box-shadow:0 1px 2px rgba(20,20,18,.04),0 14px 40px rgba(20,20,18,.06);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{margin:0 0 4px;font-size:34px}
.card .sub{color:var(--muted);margin-bottom:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.kv small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.kv b{font-size:20px;color:var(--gold)}
ul{margin:8px 0 0;padding-left:18px;line-height:1.55}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.q{font-size:14px;color:var(--muted)}
.q b{color:var(--ink)}
.qr-card{display:flex;gap:14px;align-items:center}
.qr-card #qr{flex:none;width:110px;height:110px}.qr-card svg{width:110px;height:110px}
.qr-card p{margin:0;font-size:13px;color:var(--muted)}.qr-card b{color:var(--ink)}
@media (max-width:860px){.qr-card{display:none}}
@media (max-width:860px){main{grid-template-columns:1fr;height:auto}.stage{height:62vh}}
</style>
</head>
<body>
<header><a class="mk-brand" href="../lesson.html"><span class="mk-mark">M</span>Molekula</a><h1>VR/AR · Молекулалардың кеңістіктегі пішіні</h1><a class="mk-back" id="mk-back" href="../lesson.html">← Сабаққа оралу</a></header>
<main>
  <section class="stage">
    <div class="tabs" id="tabs"></div>
    <model-viewer id="mv" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="24deg" shadow-intensity="0.6" exposure="1.05"
      environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" touch-action="pan-y" interaction-prompt="none">
      <button slot="ar-button" class="arbtn">AR-да көру — партаға қой</button>
    </model-viewer>
    <div class="hint">Айналдыр: тінтуір / саусақ · Масштаб: дөңгелек / екі саусақ</div>
  </section>
  <aside>
    <div class="card"><h2 id="f"></h2><div class="sub" id="n"></div>
      <div class="kv"><div><small>Пішіні</small><b id="shape"></b></div><div><small>Бұрыш</small><b id="angle"></b></div>
      <div><small>Атомдар</small><b id="atoms"></b></div><div><small>Байланыстар</small><b id="bonds"></b></div></div>
      <ul id="pts"></ul></div>
    <div class="card"><div class="legend" id="legend"></div></div>
    <div class="card q" id="q"></div>
    <div class="card qr-card"><div id="qr"></div><p><b>Телефонмен сканерле</b><br>Бет телефонда ашылады. «AR-да көру» бас, камераға рұқсат бер де, модельді партаға қой.</p></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const M={
 water:{f:'H₂O',n:'Су молекуласы',shape:'Иілген',angle:'≈104,5°',atoms:3,bonds:2,leg:['O','H'],pts:['Оттек — ортада, екі сутек — бір жақта','Екі жалғыз электрон жұбы пішінді иеді','AR-да бүйірінен қарап, бұрышты бағала'],q:'<b>Сұрақ:</b> су молекуласы неге түзу емес?'},
 co2:{f:'CO₂',n:'Көмірқышқыл газы',shape:'Сызықтық',angle:'180°',atoms:3,bonds:'2 қос',leg:['C','O'],pts:['Көміртек — ортада','Екі қос байланыс қарама-қарсы бағытта','Кез келген жақтан айналдырсаң да түзу'],q:'<b>Сұрақ:</b> CO₂ мен H₂O-ның пішіні неге әртүрлі?'},
 ch4:{f:'CH₄',n:'Метан',shape:'Тетраэдр',angle:'≈109,5°',atoms:5,bonds:4,leg:['C','H'],pts:['Төрт сутек — тетраэдрдің төбелерінде','Сутектер бір жазықтықта жатпайды','Модельді айналдырып, 4 бағытты сана'],q:'<b>Сұрақ:</b> метан жазық шаршы ма, тетраэдр ме?'},
 nacl:{f:'NaCl',n:'Ас тұзының иондық торы',shape:'Кубтық тор',angle:'90°',atoms:'64 ион',bonds:'6 көрші',leg:['Na','Cl'],pts:['Na⁺ және Cl⁻ кезектесіп орналасады','Ішкі ионның 6 қарама-қарсы көршісі бар','Модель Blender-де құрастырылды'],q:'<b>Сұрақ:</b> ішкі Na⁺ ионын қандай иондар қоршайды?'}
};
const C={H:'#e8f0f4',O:'#f16b69',C:'#5c6670',Na:'#8c73ff',Cl:'#40d49e'},NAME={H:'сутек',O:'оттек',C:'көміртек',Na:'Na⁺ ионы',Cl:'Cl⁻ ионы'};
const mv=document.getElementById('mv'),tabs=document.getElementById('tabs');
function show(k){const m=M[k];mv.src=`models/${k}.glb`;mv.iosSrc=`models/${k}.usdz`;mv.cameraOrbit=k==='nacl'?'30deg 65deg auto':'0deg 80deg auto';
 for(const id of['f','n','shape','angle','atoms','bonds'])document.getElementById(id).textContent=m[id];
 document.getElementById('pts').innerHTML=m.pts.map(p=>`<li>${p}</li>`).join('');
 document.getElementById('legend').innerHTML=m.leg.map(e=>`<span style="--c:${C[e]}">${e} — ${NAME[e]}</span>`).join('');
 document.getElementById('q').innerHTML=m.q;tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.k===k));history.replaceState(null,'','#'+k);drawQr()}
Object.entries(M).forEach(([k,m])=>{const b=document.createElement('button');b.className='tab';b.dataset.k=k;b.textContent=m.f;b.onclick=()=>show(k);tabs.append(b)});
function drawQr(){const el=document.getElementById('qr');if(!window.qrcode||!el)return;const q=qrcode(0,'M');q.addData(location.href);q.make();el.innerHTML=q.createSvgTag({cellSize:3,margin:0});}
show(location.hash.slice(1) in M?location.hash.slice(1):'water');
</script>
<script>(function(){const n=new URLSearchParams(location.search).get('lesson');if(n&&/^\d+$/.test(n))document.getElementById('mk-back').href='../lesson.html?lesson='+n;})();</script>
</body>
</html>
